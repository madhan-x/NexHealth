services:
  nexhealth:
    build:
      context: .
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: "5000"
      PUBLIC_DEMO_MODE: "true"
      UPLOAD_DIR: /data/uploads
      TESSERACT_CMD: /usr/bin/tesseract
    volumes:
      - nexhealth_uploads:/data/uploads

volumes:
  nexhealth_uploads:
