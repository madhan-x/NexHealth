<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" fill="none">
<style>
@keyframes character-breathe { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-2px) } }
@keyframes prop-float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-3px) } }
@keyframes soft-pulse { 0%,100% { transform: scale(1) } 50% { transform: scale(1.045) } }
@keyframes gentle-turn { 0%,100% { transform: rotate(0deg) } 50% { transform: rotate(8deg) } }
@keyframes check-draw { 0%,20% { stroke-dashoffset: 30 } 50%,100% { stroke-dashoffset: 0 } }
.character { transform-box: fill-box; transform-origin: center bottom; animation: character-breathe 3.8s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation: none !important; } }

.calendar { transform-box: fill-box; transform-origin: center; animation: prop-float 4.2s ease-in-out infinite; }
.clock-hand { transform-box: view-box; transform-origin: 275px 151px; animation: gentle-turn 4s linear infinite; }
</style>
