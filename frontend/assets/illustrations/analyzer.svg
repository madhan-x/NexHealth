<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" fill="none">
<style>
@keyframes speak { 0%,18%,100% { transform: scaleY(.45) } 8%,13% { transform: scaleY(1) } }
@keyframes explain { 0%,100% { transform: rotate(0deg) } 45% { transform: rotate(-8deg) } 70% { transform: rotate(4deg) } }
@keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-4px) } }
.mouth { transform-box: fill-box; transform-origin: center; animation: speak 2.1s ease-in-out infinite; }
.gesture { transform-box: fill-box; transform-origin: 20% 80%; animation: explain 3.2s ease-in-out infinite; }
.bubble { animation: float 3s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { .mouth,.gesture,.bubble { animation: none; } }
</style>
