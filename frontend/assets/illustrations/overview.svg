<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" fill="none">
<style>
@keyframes wave { 0%,100% { transform: rotate(0deg) } 30% { transform: rotate(-16deg) } 55% { transform: rotate(11deg) } 78% { transform: rotate(-10deg) } }
@keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-5px) } }
@keyframes speak { 0%,18%,100% { transform: scaleY(.45) } 8%,13% { transform: scaleY(1) } }
.wave { transform-box: fill-box; transform-origin: 15% 90%; animation: wave 2.6s ease-in-out infinite; }
.bubble { animation: float 3.2s ease-in-out infinite; }
.mouth { transform-box: fill-box; transform-origin: center; animation: speak 2s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { .wave,.bubble,.mouth { animation: none; } }
</style>
